  <g fill="#4e9169" stroke="#3e735e" stroke-width="5"><path d="M294 117h29v79h-29z"/><circle cx="308" cy="103" r="43"/><path d="M1136 91h28v85h-28z"/><circle cx="1150" cy="80" r="42"/></g>

