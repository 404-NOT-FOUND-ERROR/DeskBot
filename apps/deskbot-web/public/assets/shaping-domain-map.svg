  </defs>

  <!-- A wooden desktop and a shallow felt display tray. -->
  <rect width="1440" height="900" fill="url(#wood)"/><rect width="1440" height="900" fill="url(#grain)"/>
  <rect x="28" y="24" width="1384" height="852" rx="44" fill="#a97552" opacity=".42"/>
  <rect x="38" y="28" width="1364" height="830" rx="42" fill="#f0dfb5" stroke="#8f654f" stroke-width="9" filter="url(#soft-shadow)"/>
  <rect x="58" y="49" width="1324" height="790" rx="33" fill="url(#felt)" stroke="#fff3d4" stroke-width="7"/>
  <path d="M82 111h1276M82 769h1276" stroke="#7ba9a0" stroke-opacity=".18" stroke-width="2" stroke-dasharray="5 12"/>

