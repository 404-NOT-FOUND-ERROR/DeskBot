  <path d="M300 59h823l76 59-37 99-109 30-41 67-169 10-73-46-185 28-108-68-147-19-76-76z" fill="url(#water)" stroke="#388d96" stroke-width="8" filter="url(#small-shadow)"/>
  <path d="M366 103h274M721 139h249M1028 103h101" fill="none" stroke="#d8f0dc" stroke-opacity=".7" stroke-width="21" stroke-linecap="round"/>
  <path d="M400 185c77-31 145 29 219 0s151-29 224 1 142 27 224-6" fill="none" stroke="#318f9a" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 221c54-17 94 17 147 0M854 218c63-23 111 18 181-3" fill="none" stroke="#daf2d8" stroke-width="7" stroke-linecap="round"/>
