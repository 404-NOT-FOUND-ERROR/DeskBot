  <g fill="#79b66d" stroke="#568860" stroke-width="4"><path d="M91 541h48v64H91z"/><path d="M116 491c35 0 57 26 61 58H55c5-32 26-58 61-58z"/><path d="M408 501h40v61h-40z"/><path d="M428 465c31 0 48 25 51 51h-102c3-26 20-51 51-51z"/></g>
