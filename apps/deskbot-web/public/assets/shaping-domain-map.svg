  <path d="m1017 267 103-63 143 28 118 104-29 166-101 65-157-16-103-94z" fill="#b7cf83" stroke="#659369" stroke-width="9" filter="url(#small-shadow)"/>
  <g fill="#5b9a68" stroke="#3e735d" stroke-width="8" filter="url(#small-shadow)"><path d="M1060 304h35v133h-35z"/><circle cx="1077" cy="285" r="64"/><path d="M1202 319h39v156h-39z"/><circle cx="1221" cy="292" r="75"/><path d="M1324 379h32v115h-32z"/><circle cx="1340" cy="363" r="58"/></g>
