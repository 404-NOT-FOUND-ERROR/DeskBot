  <!-- Home display base: a real little dock for the first cat form. -->
  <path d="M327 650h217l39-57h278l42 57h223v190H327z" fill="#c9e0d1" stroke="#6d9c94" stroke-width="9" filter="url(#small-shadow)"/>
  <rect x="421" y="681" width="598" height="122" rx="20" fill="#8bc7ba" stroke="#4c8786" stroke-width="9"/><rect x="488" y="704" width="462" height="72" rx="13" fill="#243e4a"/><rect x="525" y="719" width="388" height="43" rx="9" fill="#9be4d2"/><rect x="702" y="730" width="37" height="24" rx="5" fill="#edbd6d"/>
  <path d="M365 693h46v92h-46zM1005 693h46v92h-46z" fill="#db6871"/><g fill="#5e7b75"><rect x="340" y="804" width="58" height="27" rx="8"/><rect x="1017" y="804" width="58" height="27" rx="8"/><rect x="448" y="814" width="92" height="20" rx="8"/><rect x="889" y="814" width="92" height="20" rx="8"/></g>
  <path d="M598 634h246l-36-58H635z" fill="#e5b36e" stroke="#9e6b58" stroke-width="8" filter="url(#small-shadow)"/><path d="M635 576h174v59H635z" fill="#f5e0a9" stroke="#9e6b58" stroke-width="8"/><circle cx="722" cy="611" r="14" fill="#e36b74"/>

  <!-- Stitched bridges join the pieces, making the map feel assembled by hand. -->
  <g fill="none" stroke-linecap="round"><path d="M453 395h151M839 395h168M476 565h122M842 565h169M722 678v-59" stroke="#f7e8bd" stroke-width="28"/><path d="M453 395h151M839 395h168M476 565h122M842 565h169M722 678v-59" stroke="#a87960" stroke-width="7" stroke-dasharray="18 18"/></g>
