name: DeskBot project checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/jev-town-client/package-lock.json
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install timezone data for the cognition runtime
        run: python -m pip install -r services/deskbot-cognition/requirements-test.txt
      - name: Select the CI Python explicitly
        run: '"DESKBOT_COGNITION_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV'
      - name: Install world-client dependencies
        run: npm.cmd --prefix apps/jev-town-client ci --ignore-scripts
      - name: Run the same project gate as local development
        run: npm.cmd test
